<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blog</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
      media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>▸</text></svg>">
</head>
<body>
<header class="site-header">
  <a href="" class="site-title" onclick="goHome(event)">emir's blog</a>
  <p class="site-tagline">systems · virtualization · engineering</p>
</header>
<nav id="nav"></nav>
<main id="content"></main>
<footer>© 2026</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>

let tocHeadings = [];
const slugCounts = {};

function slugify(text) {
  const base = text.toLowerCase()
    .replace(/<[^>]+>/g, '')
    .replace(/[^\w\s-]/g, '')
    .trim().replace(/\s+/g, '-');
  const n = slugCounts[base] || 0;
  slugCounts[base] = n + 1;
  return n ? base + '-' + n : base;
}

const customRenderer = {
  blockquote(quote) {
    const m = quote.match(/^\s*<p>\[!(INFO|WARNING|CRITICAL|NOTE|TIP)\]([^]*?)<\/p>/i);
    if (!m) return false;
    const type = m[1].toLowerCase();
    const firstLine = m[2].trim();
    const rest = quote.slice(m[0].length);
    const body = (firstLine ? '<p>' + firstLine + '</p>' : '') + rest;
    return '<aside class="callout callout-' + type + '">'
      + '<div class="callout-title">' + type + '</div>'
      + '<div class="callout-body">' + body + '</div></aside>';
  },
  heading(text, level) {
    if (level === 2 || level === 3) {
      const id = slugify(text);
      tocHeadings.push({ level, text, id });
      return '<h' + level + ' id="' + id + '">' + text + '</h' + level + '>';
    }
    return false;
  }
};
marked.use({ renderer: customRenderer });

function buildToc(headings) {
  if (headings.filter(h => h.level === 2).length < 2) return '';
  let html = '<nav class="toc"><div class="toc-title">Contents</div><ul>';
  let inSub = false;
  for (const h of headings) {
    if (h.level === 2) {
      if (inSub) { html += '</ul></li>'; inSub = false; }
      html += '<li><a href="#' + h.id + '">' + h.text + '</a>';
    } else if (h.level === 3) {
      if (!inSub) { html += '<ul>'; inSub = true; }
      html += '<li><a href="#' + h.id + '">' + h.text + '</a></li>';
    }
  }
  if (inSub) html += '</ul></li>';
  html += '</ul></nav>';
  return html;
}

function goHome(e) { e.preventDefault(); location.hash = ''; }

async function loadPosts() {
  const r = await fetch('posts.json');
  return r.json();
}

async function loadMarkdown(slug) {
  const r = await fetch('posts/' + slug + '.md');
  if (!r.ok) return null;
  let text = await r.text();
  if (text.startsWith('---')) {
    const end = text.indexOf('---', 3);
    if (end !== -1) text = text.slice(end + 3);
  }
  text = text.replace(/^\s*#\s+[^\n]*\n+/, '');
  tocHeadings = [];
  for (const k in slugCounts) delete slugCounts[k];
  const html = marked.parse(text);
  const toc = buildToc(tocHeadings);
  let intro = html, rest = '';
  if (toc) {
    const idx = html.indexOf('<h2');
    if (idx >= 0) { intro = html.slice(0, idx); rest = html.slice(idx); }
  }
  return { intro, rest, toc };
}

function renderIndex(posts) {
  document.getElementById('nav').innerHTML = '';
  let h = '';
  for (const p of posts) {
    const desc = p.description
      ? '<p class="post-desc">' + p.description + '</p>' : '';
    const tags = (p.tags || [])
      .map(t => '<span class="tag">' + t + '</span>').join(' ');
    h += '<article class="post-entry">'
      + '<time>' + p.date + '</time>'
      + '<div><a href="#' + p.slug + '">' + p.title + '</a>'
      + desc
      + '<div class="tags">' + tags + '</div></div>'
      + '</article>';
  }
  document.getElementById('content').innerHTML = h || '<p class="empty">No posts yet.</p>';
  document.title = "emir's blog";
  window.scrollTo(0, 0);
}

async function renderPost(slug, posts) {
  const meta = posts.find(p => p.slug === slug);
  if (!meta) { renderIndex(posts); return; }

  const parsed = await loadMarkdown(slug);
  if (!parsed) { renderIndex(posts); return; }

  const tags = (meta.tags || [])
    .map(t => '<span class="tag">' + t + '</span>').join(' ');

  document.getElementById('nav').innerHTML =
    '<a href="#" class="back" onclick="goHome(event)">← posts</a>';
  document.getElementById('content').innerHTML =
    '<article class="post"><h1>' + meta.title + '</h1>'
    + '<div class="post-meta"><time>' + meta.date + '</time>'
    + '<div class="tags">' + tags + '</div></div>'
    + '<div class="post-body">' + parsed.intro + '</div>'
    + parsed.toc
    + '<div class="post-body">' + parsed.rest + '</div></article>';

  document.title = meta.title + " — emir's blog";
  document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  window.scrollTo(0, 0);
}

async function route() {
  const posts = await loadPosts();
  const hash = location.hash.slice(1);
  if (!hash) { renderIndex(posts); return; }
  if (posts.some(p => p.slug === hash)) { renderPost(hash, posts); return; }
  const el = document.getElementById(hash);
  if (el) { el.scrollIntoView(); return; }
  renderIndex(posts);
}

window.addEventListener('hashchange', route);
route();

</script>
</body>
</html>
